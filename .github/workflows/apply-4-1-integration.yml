name: Apply U Ilem 4.1 integration
on:
  push:
    branches:
      - work/4-1-water-tower-map
    paths:
      - '.github/workflows/apply-4-1-integration.yml'
      - 'apply-4-1-integration.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/4-1-water-tower-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply integration
        run: node apply-4-1-integration.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add U_Ilem_4_1.html
          git rm -f apply-4-1-integration.js .github/workflows/apply-4-1-integration.yml
          git commit -m "Load modular Ollama and task transaction fixes"
          git push origin HEAD:work/4-1-water-tower-map
