name: One-time U Ilem 4.1 source patch

on:
  push:
    branches: [main]
    paths:
      - "PATCH_4_1_ONCE.js"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified patch
        run: node PATCH_4_1_ONCE.js
      - name: Commit patched game and remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add U_Ilem_4_1.html
          git rm -f PATCH_4_1_ONCE.js .github/workflows/patch-4-1-once.yml
          git commit -m "Remove 3D experiment, add lighthouse marker and fix object stage selection"
          git push origin HEAD:main
